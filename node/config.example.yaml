# XDrop node example. Copy it, set the interface and replace the node key.
# Traditional mode passes accepted packets to the kernel network stack.
# Fast Forward uses one interface pair and redirects between its interfaces.

server:
  # HTTP port; all host addresses are bound by the agent.
  port: 8080
  # Shared /api/v1/rules/hits requests per second and burst: integer 1..1000.
  hits_rate_limit: 20
  # Used in traditional mode; ignored when fast_forward.enabled is true.
  interface: "eth0"

bpf:
  # Both ELF objects are required. These paths resolve from the working directory.
  # scripts/manage-node.sh starts the agent from node/.
  main_path: bpf/xdrop_main.elf
  gate_path: bpf/xdrop_gate.elf
  # auto tries pinning and may fall back; require fails if pinning is unavailable;
  # disable skips pinning. Pins live under /sys/fs/bpf/xdrop/.
  # Restart clears policy and logical state even if links/maps survive.
  # Full controller rules and whitelist snapshots are needed for healthy status.
  # SIGTERM closes user-space link descriptors; pinned attachments survive.
  # scripts/manage-node.sh stop removes link pins after a managed process exits.
  # restart retains pins. Neither operation promises uninterrupted filtering.
  # FF settings remain while XDP is attached; removing pins after exit does not
  # restore interface settings. Inspect PROMISC, offloads and link state manually.
  pinning: "auto"
  # auto lets the kernel choose; native requires driver mode; generic requests SKB.
  xdp_mode: "auto"
  # rate_limit_divisor: 0 uses online CPUs (possible CPUs on read failure);
  # an integer 1..4096 overrides it. X7: the receiving CPU set must be fixed
  # and no larger than the divisor. A divisor that is too small amplifies
  # the aggregate rule limit: e.g. one RX queue, fixed IRQ affinity, no RPS.
  # X7：实际收包 CPU 集合必须固定且不多于除数；除数过小会放大总限速上限。
  rate_limit_divisor: 0

# Optional FF configuration: uncomment this block before auth when enabling it.
# fast_forward:
#   enabled: true
#   pairs:
#     - inbound: "ens1f0"
#       outbound: "ens1f1"
#       filter_on: "inbound"  # inbound (default), outbound, or both
# The agent brings both interfaces UP, enables PROMISC and disables GRO/LRO/TSO.
# Only one pair is supported; the interface names must differ.

auth:
  # Replace this placeholder before starting. Validate rejects CHANGE_ME values.
  # Supply the same key when registering this node in the controller.
  # Required: empty/whitespace or placeholder keys reject startup (config.Config.Validate).
  node_api_key: "CHANGE_ME_NODE_KEY"
