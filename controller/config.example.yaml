# XDrop controller/core configuration. Copy and edit before initialization.
# listen is required: host:port, port 1..65535. Use a local HTTPS reverse proxy
# for browsers: session cookies always carry Secure.
listen: "127.0.0.1:8000"
# Required absolute SQLite path; create its parent directory first.
database: "/var/lib/xdrop/controller.db"
# Required absolute path. Initialize with:
# xdrop-controller -config <file> secret-key init
# The command creates a 0600 file and refuses to overwrite an existing file.
secret_key_file: "/var/lib/xdrop/master.key"
# Register nodes using the UI/API or the offline node add CLI.
# nodes and reconcile_interval are rejected here; reconciliation is a setting.
# Unknown fields and multiple YAML documents are rejected.
